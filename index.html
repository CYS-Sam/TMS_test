<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CY2 Tide Monitor · Teesport</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/luxon@3.5.0/build/global/luxon.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script><style>:root{--b:#0874b9;--r:#d52b1e;--bg:#eef7fc;--t:#12324a;--m:#607d91;--bd:#c8deec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,"Segoe UI",sans-serif}.w{width:min(1320px,calc(100% - 28px));margin:auto}header{padding:22px 0}.box,.chart{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.v{font-size:1.65rem;font-weight:800}.pred{color:var(--b)}.actual{color:var(--r)}nav{display:flex;gap:8px;overflow:auto;margin-bottom:14px}button{padding:10px 14px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--b);font-weight:700}button.active{background:var(--b);color:#fff}.tab{display:none}.tab.active{display:block}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;color:var(--m);font-size:.8rem}.field input{width:145px;padding:9px;border:1px solid var(--bd);border-radius:8px}.chart{height:540px}.chart canvas{width:100%!important;height:100%!important}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--bd);text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:700px){.grid{grid-template-columns:1fr}.chart{height:450px}}</style></head><body><header class="w"><div class="box"><h1>CY2 Tide Monitor · Teesport</h1><div id="status">Loading sensor data...</div></div></header><main class="w"><nav><button class="active" data-tab="overview">Overview</button><button data-tab="level">Tab 1 · Tide Level</button><button data-tab="rate">Tab 2 · Tide Rate</button><button data-tab="latest">Tab 3 · Latest Record</button></nav><section id="overview" class="tab active"><div class="box grid"><div>Predicted Tide Level<div id="pl" class="v pred">--</div></div><div>Actual Tide Level<div id="al" class="v actual">--</div></div><div>Actual − Predicted<div id="dl" class="v">--</div></div></div><div class="box grid"><div>Predicted Tide Rate<div id="pr" class="v pred">--</div></div><div>Actual Tide Rate<div id="ar" class="v actual">--</div></div><div>Actual − Predicted<div id="dr" class="v">--</div></div></div></section><section id="level" class="tab"><div class="box controls"><label class="field">Quay Height (m)<input id="qh" type="number" step="0.01" value="8.64"></label><label class="field">Kalman Q<input id="kq" type="number" step="0.0001" value="0.001"></label><label class="field">Kalman R<input id="kr" type="number" step="0.01" value="0.20"></label><button id="apply">Apply</button></div><div class="chart"><canvas id="lc"></canvas></div></section><section id="rate" class="tab"><div class="chart"><canvas id="rc"></canvas></div></section><section id="latest" class="tab"><div class="box"><table><thead><tr><th>UK Time</th><th>Entry ID</th><th>Field 1 IQM Distance (m)</th></tr></thead><tbody id="body"></tbody></table></div></section></main><script>"use strict";const C={CHANNEL_ID:"3474360",READ_API_KEY:"",CSV:"tide_predictions.csv",ZONE:"Europe/London",DAYS:30,RATE_MIN:3},$=x=>document.getElementById(x),{DateTime}=luxon,S={raw:[],rows:[],pred:[],lc:null,rc:null};function fmt(v,u,s=false){return Number.isFinite(v)?(s&&v>=0?"+":"")+v.toFixed(2)+" "+u:"--"}function pms(){let p=new URLSearchParams({days:C.DAYS});if(C.READ_API_KEY)p.set("api_key",C.READ_API_KEY);return p}async function load(){let [f,c]=await Promise.all([fetch(`https://api.thingspeak.com/channels/${C.CHANNEL_ID}/feeds.json?${pms()}`,{cache:"no-store"}),fetch(C.CSV+"?v="+Date.now(),{cache:"no-store"})]);if(!f.ok||!c.ok)throw Error("Data load failed");let j=await f.json();S.raw=(j.feeds||[]).map(x=>({t:DateTime.fromISO(x.created_at,{setZone:true}).toUTC(),id:x.entry_id,d:x.field1==null||x.field1===""?null:Number(x.field1)}));let lines=(await c.text()).replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim()),h=lines[0].split(",").map(x=>x.trim().toLowerCase());S.pred=lines.slice(1).map(x=>{let a=x.split(","),o=Object.fromEntries(h.map((k,i)=>[k,(a[i]||"").trim()]));return{t:DateTime.fromFormat(o.datetime,"yyyy-MM-dd HH:mm",{zone:C.ZONE}),type:o.type,level:Number(o.level)}}).filter(x=>x.t.isValid&&Number.isFinite(x.level)).sort((a,b)=>a.t-b.t);calc();render()}function pred(t){for(let i=0;i<S.pred.length-1;i++){let a=S.pred[i],b=S.pred[i+1];if(t>=a.t&&t<=b.t){let D=b.t.diff(a.t,"hours").hours,e=t.diff(a.t,"hours").hours,x=e/D;return{level:a.level+(b.level-a.level)*(1-Math.cos(Math.PI*x))/2,rate:(b.level-a.level)*Math.PI/(2*D)*Math.sin(Math.PI*x)}}}return null}function calc(){let h=Number($("qh").value),q=Number($("kq").value),r=Number($("kr").value),x=null,P=1;S.rows=S.raw.map(o=>{if(!Number.isFinite(o.d))return{...o,level:null,rate:null};let z=h-o.d;if(x===null)x=z;else{P+=q;let k=P/(P+r);x+=k*(z-x);P=(1-k)*P}return{...o,level:Number(x.toFixed(4)),rate:null}});let v=S.rows.filter(o=>Number.isFinite(o.level));for(let i=0;i<v.length;i++){let target=v[i].t.minus({minutes:C.RATE_MIN}).toMillis(),j=i-1;while(j>=0&&v[j].t.toMillis()>target)j--;if(j>=0){let hrs=v[i].t.diff(v[j].t,"hours").hours;if(hrs>0)v[i].rate=(v[i].level-v[j].level)/hrs}}}function options(title){return{responsive:true,maintainAspectRatio:false,parsing:false,elements:{point:{radius:0},line:{borderWidth:2}},scales:{x:{type:"time",time:{unit:"hour",displayFormats:{hour:"dd LLL HH:mm"}},adapters:{date:{zone:C.ZONE}},title:{display:true,text:"UK Local Date and Time"}},y:{title:{display:true,text:title}}},plugins:{tooltip:{callbacks:{title:i=>i.length?DateTime.fromMillis(i[0].parsed.x).setZone(C.ZONE).setLocale("en-GB").toFormat("dd LLL yyyy HH:mm"):""}}}}}function render(){let ld=S.rows.filter(x=>Number.isFinite(x.level)).map(x=>({x:x.t.toMillis(),y:x.level})),rd=S.rows.filter(x=>Number.isFinite(x.rate)).map(x=>({x:x.t.toMillis(),y:x.rate}));S.lc?.destroy();S.rc?.destroy();S.lc=new Chart($("lc"),{type:"line",data:{datasets:[{label:"Actual Tide Level (Kalman)",data:ld,borderColor:"#d52b1e"}]},options:options("Tide Level (m)")});let ro=options("Tide Rate (m/hr)");ro.scales.y.min=-1.5;ro.scales.y.max=1.5;S.rc=new Chart($("rc"),{type:"line",data:{datasets:[{label:"Actual Tide Rate",data:rd,borderColor:"#d52b1e"}]},options:ro});let last=[...S.rows].reverse().find(x=>Number.isFinite(x.level)),p=pred(last?.t||DateTime.utc());$("pl").textContent=fmt(p?.level,"m");$("al").textContent=fmt(last?.level,"m");$("dl").textContent=fmt(last?.level-p?.level,"m",true);$("pr").textContent=fmt(p?.rate,"m/hr",true);$("ar").textContent=fmt(last?.rate,"m/hr",true);$("dr").textContent=fmt(last?.rate-p?.rate,"m/hr",true);$("status").textContent=last?"Latest sensor record: "+last.t.setZone(C.ZONE).setLocale("en-GB").toFormat("dd LLL yyyy HH:mm"):"No sensor data";$("body").innerHTML=[...S.raw].reverse().slice(0,180).map(x=>`<tr><td>${x.t.setZone(C.ZONE).setLocale("en-GB").toFormat("dd LLL yyyy HH:mm")}</td><td>${x.id}</td><td>${Number.isFinite(x.d)?x.d.toFixed(4):"No data"}</td></tr>`).join("")}document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.id===b.dataset.tab))});$("apply").onclick=()=>{calc();render()};load();setInterval(load,60000);</script></body></html>
